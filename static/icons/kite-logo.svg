<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SSG Book">
  <!-- Flat kite mark: four panels separated by the cross-spars (left as
       transparent gaps), and a tail that doubles as an S. Navy kite, copper
       tail: the website's two brand colours. -->
  <defs>
    <mask id="spars" maskUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80">
      <rect x="-8" y="-8" width="80" height="80" fill="#fff"/>
      <g stroke="#000" stroke-width="3" stroke-linecap="round">
        <line x1="32" y1="-2" x2="32" y2="44"/>
        <line x1="8" y1="17" x2="56" y2="17"/>
      </g>
    </mask>
  </defs>
  <g transform="rotate(-12 32 31)">
    <polygon points="32,3.5 51,17 32,40 13,17" fill="#1d588c" stroke="#1d588c" stroke-width="1.4" stroke-linejoin="round" mask="url(#spars)"/>
    <path d="M32 41.5 C 25.5 45, 25.5 49.5, 32 51.5 S 38.5 57.5, 32 61" fill="none" stroke="#c98a3f" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

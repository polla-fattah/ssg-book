<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="240" height="40" role="img" aria-label="Open Source Project on GitHub">
  <defs>
    <linearGradient id="os-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container badge with rounded pill -->
  <g filter="url(#shadow)">
    <!-- Base dark pill -->
    <rect x="1" y="2" width="238" height="36" rx="18" fill="#181717" stroke="#374151" stroke-width="1" />

    <!-- Left section: GitHub Octocat -->
    <g transform="translate(14, 10)">
      <!-- GitHub Octocat SVG Path -->
      <path fill="#FFFFFF" d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V19c0 .27.16.59.67.5C17.14 18.16 20 14.42 20 10A10 10 0 0 0 10 0z"/>
    </g>

    <!-- Divider line -->
    <line x1="42" y1="8" x2="42" y2="32" stroke="#374151" stroke-width="1" />

    <!-- Right section pill: Open Source -->
    <rect x="48" y="6" width="184" height="28" rx="14" fill="url(#os-grad)" />

    <!-- Open Source Initiative wireframe / heart icon -->
    <g transform="translate(56, 12)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
      <line x1="8" y1="2" x2="8" y2="8" stroke="#059669" stroke-width="2.5" />
      <line x1="8" y1="1" x2="8" y2="6" stroke="#FFFFFF" stroke-width="1.8" />
    </g>

    <!-- Badge Text -->
    <text x="76" y="24.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">OPEN SOURCE PROJECT</text>
  </g>
</svg>

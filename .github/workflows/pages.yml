name: Publish book site

# Builds the book site with Hugo and deploys it to GitHub Pages. Requires
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# The theme's own test suite lives in ci.yml and runs only on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: "0.165.0"
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        shell: bash
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --silent --show-error --remote-name "$base/$archive"
          curl --fail --location --retry 3 --silent --show-error \
            --output checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check
          mkdir -p hugo-bin
          tar -xzf "$archive" -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build the website
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo version
          hugo --minify --printPathWarnings --panicOnWarning --baseURL "${PAGES_BASE_URL}/"

      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

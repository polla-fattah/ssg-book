# The home page. OINK renders the sections listed under `sections`, in order,
# from the blocks below; the Markdown body of content/_index.md is not shown on
# the home page. tests/site/data/home/en.yaml shows every section type.
#
# Every figure and claim here is checkable against the book. The demo site's
# testimonials, contributors, and showcase blocks are deliberately absent:
# there is no real data for them yet.
sections:
  - hero
  - metrics
  - steps
  - type: cards
    key: paths
  - timeline
  - type: logo-wall
    key: topics
  - type: logo-wall
    key: tools
  - faq
  - principles
  - cta

hero:
  logo: icons/logo.svg
  title: Static Site Generators in the Age of AI
  # Caps the title's size; below about 950px wide it scales with the window.
  title_size: 3rem
  subtitle: Building and Maintaining Content with AI Agents
  # The author's illustration with its black background removed; the full-size
  # copy is "Chapters and plan/cover/hero.png" in the book workspace.
  image:
    src: images/hero-book.webp
    alt: >
      Source files and code snippets flow along connected lines into a published
      website, with a page layout, a book chapter, and a branching Git history
      beside it.
  # Text and illustration share the width equally, and the image may grow past
  # the theme's 480px default. It is left out on phones, where it would push
  # the text down.
  media:
    ratio: 1fr 1fr
    max_width: 620px
    hide_below: md
  desc: >
    One small website, built from its first Markdown page through publication,
    review, and long-term maintenance, with an AI agent helping and a person
    deciding what goes live. No prior HTML, Git, or command-line experience
    is assumed.
  actions:
    - label: "Start reading: Chapter 1"
      url: book/chapter_01_your_first_hugo_website/
      icon: fa-solid fa-book-open
      style: primary
    - label: Choose a learning path
      url: paths/
      icon: fa-solid fa-route
      style: ghost

metrics:
  eyebrow: 
  title: The book in four numbers
  desc: Each one is checkable against the chapters.
  columns: 4
  items:
    - value: 19
      label: Chapters
      desc: from a first page to your own project
    - value: 33
      label: Learning topics
      desc: practised or explained along the way
    - value: 4
      label: Learning paths
      desc: from beginner to site maintainer
    - value: 0
      label: Prior experience assumed
      desc: no programming, Git, or terminal

steps:
  title: How every chapter works
  items:
    - title: See the result first
      desc: Each chapter opens with what you will have at the end and what you will be able to do.
    - title: Make one small change early
      desc: A working edit comes before the explanation, so every idea has something real to attach to.
    - title: Break something on purpose
      desc: A deliberate mistake, how to recognise it, and how to recover. The build passing is never the whole check.
    - title: Try it your way, then save
      desc: An independent variation shows you understood the idea. A checklist and a saved checkpoint close the chapter.

paths:
  eyebrow: 
  title: Learning paths
  desc: 
  columns: 4
  link_label: See the path
  items:
    - name: The complete path
      icon: fa-solid fa-seedling
      meta: No experience needed
      desc: All nineteen chapters in order. Your site is published by Chapter 7.
      url: paths/#new
    - name: Web-literate
      icon: fa-solid fa-code
      meta: HTML, CSS, JSON, YAML
      desc: Skim the markup and format explanations; slow down for Hugo, Git, publishing, and agents.
      url: paths/#some-experience
    - name: Software engineers
      icon: fa-solid fa-terminal
      meta: Hugo and CI/CD
      desc: A brisk setup, then Hugo's templates and data, the Pages pipeline, and checks on every change.
      url: paths/#developers
    - name: Maintainers and teams
      icon: fa-solid fa-people-group
      meta: An existing website
      desc: Bring AI agents into a site you already run, with review, required checks, and maintenance.
      url: paths/#teams

timeline:
  title: The arc of the book
  items:
    - date: Chapters 1–5
      title: Build and understand a first site
      desc: A local preview, Markdown, sections and navigation, then the HTML and CSS behind the pages.
      url: book/chapter_01_your_first_hugo_website/
    - date: Chapters 6–7
      title: Record it and publish it
      desc: Git history you can recover from, then a public address through GitHub Pages.
      url: book/chapter_06_track_and_recover_your_hugo_site_with_git/
    - date: Chapters 8–12
      title: Bring in an agent and give content a structure
      desc: One bounded agent task, then content models, Hugo templates, reusable layouts, and JSON data.
      url: book/chapter_08_work_with_an_ai_agent_on_your_hugo_site/
    - date: Chapters 13–17
      title: Contribute, check, and reach readers
      desc: Sourced agent content, checks on every change, search, a second language, and a contact form.
      url: book/chapter_13_create_and_maintain_content_with_ai_agents/
    - date: Chapters 18–19
      title: Keep it running, then make your own
      desc: Maintenance and recovery after a change is live, then a project planned from your own brief.
      url: book/chapter_18_maintain_migrate_and_recover/


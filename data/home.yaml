faq:
  eyebrow: 
  title: FAQ
  items:
    - question: Who is this book for?
      answer: >
        Anyone who can manage files, use a browser, and install software, and
        who wants to publish a useful website they understand. No prior
        programming, Git, terminal, or web-publishing experience is assumed.
      open: true
    - question: What do I need?
      answer: |
        A desktop or laptop computer on which you can install software, and an
        internet connection. From Chapter 7 you need a free GitHub account to
        publish; from Chapter 8, an account with access to an AI agent. Each
        chapter states its requirements before its exercises.
    - question: Does it cost anything?
      answer: >
        Hugo, Git, and VS Code are free, and a public repository publishes to
        GitHub Pages without charge. AI agent access depends on your own account
        and its usage limits, and Chapter 8 asks you to check them before you
        begin.
    - question: Will the AI agent build the website for me?
      answer: >
        It will help, and you stay responsible for what gets published. The
        book teaches you to give an agent a bounded task, read every change it
        makes, check its claims against your sources, and decide publication
        yourself.
    - question: Why Hugo?
      answer: >
        One generator keeps every exercise consistent. The ideas it teaches
        (content, templates, structured data, a build step, and a publishing
        workflow) carry over to other static site generators.
    - question: Is the book finished?
      answer: >
        All nineteen chapters are written, and the book is a working draft. Each
        chapter opens with a note recording how far it has been tested.
        Lecture slides are being added chapter by chapter, starting with the
        course introduction, and a playground is in preparation.

principles:
  eyebrow: 
  title: Principles of SSG
  columns: 3
  items:
    - icon: fa-solid fa-file-lines
      title: Plain text you control
      desc: Your content is Markdown in folders you can copy, so it outlives any one tool or host.
    - icon: fa-solid fa-code-compare
      title: Every change is reviewable
      desc: Git records what changed and why, whether a person or an agent made the change.
    - icon: fa-solid fa-scale-balanced
      title: Machines check rules; people judge meaning
      desc: A passing build proves the site renders. Only a person can decide that it is true.


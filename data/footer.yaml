      - { label: Learning topics, url: topics/ }
  - title: Teach and practise
    links:
      - { label: Lecture slides, url: slides/ }
      - { label: Playground, url: playground/ }
  - title: News
    links:
      - { label: Posts, url: posts/ }
  - title: Source
    links:
